
name: 台股收盤分析與網站部署

on:
  schedule:
    - cron: '30 12 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'stocks.json'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 分析程式測試
        run: python -m unittest discover -s tests -v
      - name: 還原市場歷史快取
        uses: actions/cache/restore@v4
        with:
          path: .cache/market-history
          key: market-history-v2-${{ github.run_id }}
          restore-keys: |
            market-history-v2-
      - name: 擷取全市場歷史 OHLC／法人資料並建立獨立股票檔
        continue-on-error: true
        run: python scripts/market_history.py --days 238 --max-missing 120
      - name: 保存累積歷史快取供下次增量更新
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/market-history
          key: market-history-v2-${{ github.run_id }}
      - name: 補充原始六檔較長的 FinMind 歷史
        continue-on-error: true
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/update.py
      - name: 將已部署的 Worker API URL 寫入網站公開設定
        env:
          RADAR_API_BASE_URL: ${{ vars.RADAR_API_BASE_URL }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          url = os.environ.get("RADAR_API_BASE_URL", "").rstrip("/")
          if url and not url.startswith("https://"):
              raise SystemExit("RADAR_API_BASE_URL 必須是 https 網址")
          pathlib.Path("docs/api-config.js").write_text(
              "window.RADAR_API_BASE = " + json.dumps(url) + ";\n",
              encoding="utf-8"
          )
          print("外部 API 設定狀態：", "已設定" if url else "尚未設定，顯示靜態快取")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
